site_name: cl-asciiquarium
site_description: An original ASCII-art aquarium screensaver for the terminal.
site_url: https://nerima-lisp.github.io/cl-asciiquarium/
repo_url: https://github.com/nerima-lisp/cl-asciiquarium
repo_name: nerima-lisp/cl-asciiquarium
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Keybindings and CLI: guide/usage.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
  - Project:
      - Roadmap: project/roadmap.md
